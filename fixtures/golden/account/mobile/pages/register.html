  "plugins": [
    (function ({ addUtilities, addComponents, theme }) {
        /**
         * fontSize token 为 [size, { lineHeight, letterSpacing }] 数组形态，
         * theme('fontSize.xs') 返回整个数组；直接赋给 fontSize 会生成
         * `font-size: 0.75rem,1.5` 这样的非法 CSS 并被整条丢弃。
         * 因此组件类里的字号必须经这两个助手解包，禁止再写裸字面量。
         */
        const typeSize = (key) => {
          const v = theme(`fontSize.${key}`);
          return Array.isArray(v) ? v[0] : v;
        };
        const typeLineHeight = (key) => {
          const v = theme(`fontSize.${key}`);
          return Array.isArray(v) ? (v[1] && v[1].lineHeight) || theme('lineHeight.normal') : theme('lineHeight.normal');
        };

        // 文本截断
        addUtilities({
          '.text-balance': { 'text-wrap': 'balance' },
          '.line-clamp-1': { display: '-webkit-box', '-webkit-line-clamp': '1', '-webkit-box-orient': 'vertical', overflow: 'hidden' },
          '.line-clamp-2': { display: '-webkit-box', '-webkit-line-clamp': '2', '-webkit-box-orient': 'vertical', overflow: 'hidden' },
          '.line-clamp-3': { display: '-webkit-box', '-webkit-line-clamp': '3', '-webkit-box-orient': 'vertical', overflow: 'hidden' },
        });

        // 滚动条隐藏
        addUtilities({
          '.scrollbar-hide': {
            '-ms-overflow-style': 'none',
            'scrollbar-width': 'none',
            '&::-webkit-scrollbar': { display: 'none' },
          },
        });

        // 毛玻璃
        addUtilities({
          '.glass': {
            background: 'rgba(255, 255, 255, 0.7)',
            backdropFilter: 'blur(20px)',
            border: '1px solid rgba(255, 255, 255, 0.2)',
          },
          '.glass-dark': {
            background: 'rgba(0, 0, 0, 0.3)',
            backdropFilter: 'blur(20px)',
            border: '1px solid rgba(255, 255, 255, 0.1)',
          },
        });

        // 排版与装饰工具类
        // 语义排版角色：role → 解包后的 { fontSize, lineHeight, fontWeight }
        // （token 来自 theme.typeRole，由 generateTailwindConfig 按平台注入）
        const role = (name, letterSpacing) => {
          const r = theme(`typeRole.${name}`) || {};
          const token = r.token || 'base';
          const out = {
            fontSize: typeSize(token),
            lineHeight: typeLineHeight(token),
            fontWeight: r.weight || '400',
          };
          if (letterSpacing) out.letterSpacing = letterSpacing;
          return out;
        };
        addUtilities({
          // 眉标：大写、宽字距的小标签
          '.eyebrow': {
            fontSize: typeSize('micro'),
            fontWeight: '600',
            letterSpacing: '0.14em',
            textTransform: 'uppercase',
            lineHeight: '1',
          },
          // ── 语义排版角色：同类元素一律引用，禁止再用裸 text-* 表达这些角色 ──
          // 注意：这些类走 addUtilities（层叠后于核心 text-* utility），
          // 故不再设置 color —— 否则会覆盖 `text-rose-600` 之类的颜色类；
          // 默认颜色靠 layout body 的 text-neutral-900 继承。
          '.page-title': role('pageTitle', '-0.015em'),
          '.nav-title': role('navTitle', '-0.01em'),
          '.hero-title': role('heroTitle', '-0.015em'),
          '.section-title': role('sectionTitle', '-0.01em'),
          '.item-title': role('itemTitle', '-0.005em'),
          '.price': role('price'),
          '.price-hero': role('priceHero', '-0.015em'),
          '.stat-value': role('statValue', '-0.015em'),
          '.stat-hero': role('statHero', '-0.015em'),
          '.label': role('label'),
          '.meta': role('meta'),
          // 极细分割线
          '.hairline': {
            height: '1px',
            background: theme('colors.neutral.200'),
            border: 'none',
          },
          // 图片底部渐隐遮罩（用于图文叠加可读性）
          '.hero-overlay': {
            background: 'linear-gradient(to top, rgba(2,6,23,0.82) 0%, rgba(2,6,23,0.30) 45%, rgba(2,6,23,0) 100%)',
          },
          // 卡片悬停轻抬升
          '.card-lift': {
            transition: 'transform 250ms cubic-bezier(0.4,0,0.2,1), box-shadow 250ms cubic-bezier(0.4,0,0.2,1)',
            '&:hover': { transform: 'translateY(-2px)', boxShadow: theme('boxShadow.lg') },
          },
          // 焦点环
          '.focus-ring': {
            outline: 'none',
            '&:focus-visible': { outline: '2px solid', outlineOffset: '2px', outlineColor: theme('colors.brand.500') },
          },
        });

        // 组件类
        addComponents({
          '.btn': {
            display: 'inline-flex',
            alignItems: 'center',
            justifyContent: 'center',
            gap: '0.5rem',
            fontWeight: '600',
            fontSize: typeSize('sm'),
            letterSpacing: '-0.005em',
            borderRadius: theme('borderRadius.xl'),
            transition: 'background-color 150ms ease-out, box-shadow 150ms ease-out, transform 120ms ease-out',
            cursor: 'pointer',
            border: 'none',
            outline: 'none',
            whiteSpace: 'nowrap',
            '&:disabled': { opacity: '0.5', cursor: 'not-allowed' },
            '&:focus-visible': { outline: '2px solid', outlineOffset: '2px', outlineColor: theme('colors.brand.500') },
          },
          '.btn-primary': {
            backgroundColor: theme('colors.brand.600'),
            color: 'white',
            boxShadow: '0 1px 2px 0 rgb(15 23 42 / 0.12)',
            '&:hover:not(:disabled)': { backgroundColor: theme('colors.brand.700'), boxShadow: '0 4px 10px -2px rgb(15 23 42 / 0.18)' },
            '&:active:not(:disabled)': { backgroundColor: theme('colors.brand.800'), transform: 'translateY(1px)' },
          },
          '.btn-secondary': {
            backgroundColor: theme('colors.neutral.100'),
            color: theme('colors.neutral.900'),
            '&:hover:not(:disabled)': { backgroundColor: theme('colors.neutral.200') },
            '&:active:not(:disabled)': { backgroundColor: theme('colors.neutral.300') },
          },
          '.btn-ghost': {
            backgroundColor: 'transparent',
            color: theme('colors.neutral.700'),
            '&:hover:not(:disabled)': { backgroundColor: theme('colors.neutral.100') },
            '&:active:not(:disabled)': { backgroundColor: theme('colors.neutral.200') },
          },
          '.btn-outline': {
            backgroundColor: 'white',
            border: `1px solid ${theme('colors.neutral.200')}`,
            color: theme('colors.neutral.800'),
            '&:hover:not(:disabled)': { borderColor: theme('colors.neutral.300'), backgroundColor: theme('colors.neutral.50') },
          },
          '.input': {
            width: '100%',
            padding: '0.625rem 0.875rem',
            fontSize: typeSize('sm'),
            lineHeight: typeLineHeight('sm'),
            color: theme('colors.neutral.900'),
            backgroundColor: 'white',
            border: `1px solid ${theme('colors.neutral.200')}`,
            borderRadius: theme('borderRadius.xl'),
            transition: 'border-color 150ms ease-out, box-shadow 150ms ease-out',
            boxShadow: '0 1px 2px 0 rgb(15 23 42 / 0.03)',
            '&:focus': { outline: 'none', borderColor: theme('colors.brand.400'), boxShadow: `0 0 0 3px ${theme('colors.brand.100')}` },
            '&::placeholder': { color: theme('colors.neutral.400') },
            '&:disabled': { backgroundColor: theme('colors.neutral.100'), cursor: 'not-allowed' },
          },
          '.card': {
            backgroundColor: 'white',
            borderRadius: theme('borderRadius.2xl'),
            boxShadow: theme('boxShadow.sm'),
            border: `1px solid ${theme('colors.neutral.200')}`,
            transition: 'box-shadow 220ms cubic-bezier(0.4,0,0.2,1), border-color 220ms ease-out, transform 220ms cubic-bezier(0.4,0,0.2,1)',
            '&:hover': { boxShadow: theme('boxShadow.lg'), borderColor: theme('colors.neutral.300') },
          },
          '.badge': {
            display: 'inline-flex',
            alignItems: 'center',
            gap: '0.25rem',
            padding: '0.1875rem 0.5rem',
            fontSize: typeSize('micro'),
            fontWeight: '600',
            lineHeight: typeLineHeight('micro'),
            borderRadius: theme('borderRadius.full'),
          },
          // 涨跌/变化量胶囊（数值型 delta）。WHY 与 .badge（micro=11、600）分开：
          // 它承载的是带图标的数值对比短语（`+18.3% 环比`），档位为 xs=12、字重 500，
          // 两页（desktop home/dashboard）此前各自写死 `rounded-full px-2 py-0.5 text-xs font-medium`
          // —— 形似 .badge 而档位不同，属「未被契约覆盖的同值重复」，本轮收纳为独立组件类。
          // 不设 color：颜色由调用方的语义色类（text-rose-600 / text-emerald-600）决定。
          '.delta': {
            display: 'inline-flex',
            alignItems: 'center',
            gap: '0.25rem',
            padding: '0.125rem 0.5rem',
            fontSize: typeSize('xs'),
            fontWeight: '500',
            lineHeight: typeLineHeight('xs'),
            borderRadius: theme('borderRadius.full'),
          },
          // 柔性胶囊标签（品牌色调）
          '.chip': {
            display: 'inline-flex',
            alignItems: 'center',
            gap: '0.25rem',
            padding: '0.3125rem 0.75rem',
            fontSize: typeSize('xs'),
            fontWeight: '500',
            color: theme('colors.neutral.600'),
            backgroundColor: theme('colors.neutral.100'),
            borderRadius: theme('borderRadius.full'),
            border: `1px solid ${theme('colors.neutral.200')}`,
            transition: 'background-color 150ms ease-out, color 150ms ease-out',
            '&:hover': { backgroundColor: theme('colors.neutral.200'), color: theme('colors.neutral.800') },
          },
          // 统计块
          '.stat': {
            backgroundColor: 'white',
            borderRadius: theme('borderRadius.2xl'),
            border: `1px solid ${theme('colors.neutral.200')}`,
            boxShadow: theme('boxShadow.sm'),
            padding: '1.25rem',
          },
        });
      })
  ]
};
</script>

    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, SF Pro Text, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    ::selection { background-color: hsl(215, 28%, 52%); color: hsl(215, 53%, 20%); }
    .lucide { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: hsl(220, 12%, 82%); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: hsl(220, 10%, 64%); }
  </style></head>
<body class="bg-neutral-50 text-neutral-900 antialiased" style="min-height:100vh">
<div class="min-h-full bg-neutral-50 pb-10">
    <header class="px-page pt-14 pb-6">
    <div class="flex items-center justify-between">
      <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-sm font-bold text-white shadow-sm" style="background:hsl(215, 38%, 35%)" aria-hidden="true">账</span>      <a href="home.html" class="grid h-10 w-10 place-items-center rounded-full bg-white text-neutral-600 shadow-sm ring-1 ring-neutral-200/70 active:scale-95 transition" aria-label="暂不注册，先逛逛"><i data-lucide="x" class="text-lg"></i></a>
    </div>
    <h2 class="page-title mt-6 text-neutral-900">创建账号</h2>
    <p class="mt-1.5 text-sm text-neutral-500">注册后浏览记录与订单可在多端同步</p>
  </header>
  <main class="px-page space-y-4">
    <section class="card p-5" aria-label="注册表单">
      <div class="space-y-4">
                  <div>
            <label for="reg-phone" class="label mb-1.5 block text-neutral-600">手机号 <span class="text-rose-500" aria-hidden="true">*</span></label>
            <div class="flex gap-2">
              <input id="reg-phone" type="text" autocomplete="tel" class="input min-w-0 flex-1" placeholder="请输入手机号" required aria-required="true" />
                          </div>
          </div>
                  <div>
            <label for="reg-code" class="label mb-1.5 block text-neutral-600">短信验证码 <span class="text-rose-500" aria-hidden="true">*</span></label>
            <div class="flex gap-2">
              <input id="reg-code" type="text" autocomplete="one-time-code" class="input min-w-0 flex-1" placeholder="请输入 6 位验证码" required aria-required="true" />
                              <button type="button" data-send-code data-countdown="60" data-idle="获取验证码" data-counting="重新获取" data-status-sent="验证码已发送，{{s}} 秒后可重新获取" data-status-ready="可以重新获取验证码" class="btn btn-outline shrink-0 px-3 py-2 active:scale-95" aria-label="获取短信验证码">获取验证码</button>
                <p role="status" aria-live="polite" aria-atomic="true" class="sr-only" data-code-status></p>
                          </div>
          </div>
                  <div>
            <label for="reg-password" class="label mb-1.5 block text-neutral-600">设置密码 <span class="text-rose-500" aria-hidden="true">*</span></label>
            <div class="flex gap-2">
              <input id="reg-password" type="password" autocomplete="new-password" class="input min-w-0 flex-1" placeholder="8-20 位，含字母与数字" required aria-required="true" />
                          </div>
          </div>
                <label class="flex items-start gap-2 text-sm text-neutral-600"><input id="reg-agree" type="checkbox" class="mt-0.5 h-4 w-4 shrink-0 rounded text-brand-600" /><span>我已阅读并同意<a href="#" class="text-brand-600 transition active:opacity-70">《用户协议》</a><a href="#" class="text-brand-600 transition active:opacity-70">《隐私政策》</a></span></label>
        <button class="btn btn-primary w-full py-3 active:scale-95">注册</button>
      </div>
    </section>
    <p class="text-center text-sm text-neutral-500">已有账号？ <a href="login.html" class="font-medium text-brand-600 transition active:opacity-70">去登录</a></p>
    <a href="home.html" class="btn btn-ghost w-full py-2.5"><i data-lucide="arrow-right" class="text-base"></i>暂不注册，先逛逛</a>
  </main>
  <script>
    (function () {
      var toArr = function (n) { return Array.prototype.slice.call(n); };
      // a11y（WCAG 4.1.3 状态消息）：按钮文案每秒都在变，**不能**把 live region 放在按钮上（会每秒播报）；
      // 故只在「开始倒计时 / 倒计时结束」两次写入旁侧的 role="status" 节点（可见文案仍逐秒更新）。
      toArr(document.querySelectorAll('[data-send-code]')).forEach(function (b) {
        var timer = null;
        var row = b.parentElement;
        var status = row ? row.querySelector('[data-code-status]') : null;
        var say = function (tpl, n) {
          if (status && tpl) { status.textContent = tpl.replace('{{s}}', String(n)); }
        };
        b.addEventListener('click', function () {
          if (timer) { return; }
          var left = Number(b.getAttribute('data-countdown')) || 60;
          var counting = b.getAttribute('data-counting');
          b.disabled = true;
          b.classList.add('opacity-60');
          b.textContent = counting + '（' + left + 's）';
          say(b.getAttribute('data-status-sent'), left);
          timer = setInterval(function () {
            left -= 1;
            if (left <= 0) {
              clearInterval(timer); timer = null;
              b.disabled = false; b.classList.remove('opacity-60');
              b.textContent = b.getAttribute('data-idle');
              say(b.getAttribute('data-status-ready'), 0);
              return;
            }
            b.textContent = counting + '（' + left + 's）';
          }, 1000);
        });
      });
    })();
  </script>
</div>
</body>
</html>
